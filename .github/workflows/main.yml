name: Update MLB streak data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Generate MLB data
        run: |
          mkdir -p data

          python << 'EOF'
          import json
          import re
          import time
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime, timezone, date, timedelta

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          }

          HIT_URL = "https://www.baseballmusings.com/cgi-bin/CurStreak.py"

          def get_json(url):
              response = requests.get(url, headers=HEADERS, timeout=30)
              response.raise_for_status()
              return response.json()

          def get_text(url):
              response = requests.get(url, headers=HEADERS, timeout=30)
              response.raise_for_status()
              return response.text

          def safe_avg(values):
              return round(sum(values) / len(values), 1) if values else 0

          def over_pct(values, line):
              if not values or line is None:
                  return 0
              return round(sum(1 for v in values if v > line) / len(values) * 100)

          def scrape_hit_streaks():
              response_text = get_text(HIT_URL)
              soup = BeautifulSoup(response_text, "html.parser")

              text = soup.get_text(" ", strip=True)
              text = text.replace("Slug%Last Game Date", "Slug% Last Game Date")

              date_match = re.search(r"Through Games of\s+(\d{2}/\d{2}/\d{4})", text)

              if date_match:
                  hit_through_date = datetime.strptime(date_match.group(1), "%m/%d/%Y").date()
              else:
                  hit_through_date = date.today()

              header_pattern = re.compile(
                  r"Player\s+Games\s+At\s+Bats\s+Runs\s+Hits\s+HR\s+RBI\s+BB\s+K\s+BA\s+OBA\s+Slug%\s+Last\s+Game\s+Date",
                  re.IGNORECASE
              )

              text = header_pattern.sub(" ", text)

              if "Current Hit Streaks" in text:
                  text = text.split("Current Hit Streaks", 1)[-1]

              if "The information used here" in text:
                  text = text.split("The information used here", 1)[0]

              row_pattern = re.compile(
                  r"([A-Z][A-Za-zÀ-ÖØ-öø-ÿ0-9.'’\-\s]+?)\s+"
                  r"(\d+)\s+"
                  r"(\d+)\s+"
                  r"(\d+)\s+"
                  r"(\d+)\s+"
                  r"(\d+)\s+"
                  r"(\d+)\s+"
                  r"(\d+)\s+"
                  r"(\d+)\s+"
                  r"(\.\d+)\s+"
                  r"(\.\d+)\s+"
                  r"(\d+\.\d+|\.\d+)\s+"
                  r"(\d{4}-\d{2}-\d{2})"
              )

              hits = []

              bad_words = [
                  "Baseball Musings",
                  "Day By Day",
                  "Pledge Drive",
                  "Games Through Date",
                  "Submit",
                  "Retrosheet",
                  "Baseball Info Solutions"
              ]

              for match in row_pattern.finditer(text):
                  player = " ".join(match.group(1).split()).strip()

                  if any(bad in player for bad in bad_words):
                      continue

                  hits.append({
                      "player": player,
                      "games": int(match.group(2)),
                      "atBats": int(match.group(3)),
                      "runs": int(match.group(4)),
                      "hits": int(match.group(5)),
                      "hr": int(match.group(6)),
                      "rbi": int(match.group(7)),
                      "bb": int(match.group(8)),
                      "k": int(match.group(9)),
                      "ba": match.group(10),
                      "oba": match.group(11),
                      "slug": match.group(12),
                      "lastGameDate": match.group(13)
                  })

              hits.sort(key=lambda x: x["games"], reverse=True)
              return hits, hit_through_date

          def load_props():
              try:
                  with open("data/props.json", "r", encoding="utf-8") as f:
                      return json.load(f)
              except:
                  return {"pitcherStrikeoutLines": {}}

          def get_schedule_games(start_date, end_date):
              schedule_url = (
                  "https://statsapi.mlb.com/api/v1/schedule"
                  f"?sportId=1&gameType=R&startDate={start_date}&endDate={end_date}"
              )

              schedule = get_json(schedule_url)
              games = []

              for day in schedule.get("dates", []):
                  game_date = day.get("date")

                  for game in day.get("games", []):
                      game_pk = game.get("gamePk")
                      status = game.get("status", {})
                      abstract_state = status.get("abstractGameState", "")
                      detailed_state = status.get("detailedState", "")

                      if not game_pk:
                          continue

                      if abstract_state == "Final" or detailed_state in ["Final", "Completed Early"]:
                          games.append({
                              "gamePk": game_pk,
                              "date": game_date,
                              "home": game.get("teams", {}).get("home", {}).get("team", {}).get("name", ""),
                              "away": game.get("teams", {}).get("away", {}).get("team", {}).get("name", "")
                          })

              return games

          def get_starting_pitchers_for_date(target_date):
              schedule_url = (
                  "https://statsapi.mlb.com/api/v1/schedule"
                  f"?sportId=1&gameType=R&date={target_date}"
              )

              schedule = get_json(schedule_url)
              pitchers = []

              for day in schedule.get("dates", []):
                  for game in day.get("games", []):
                      game_pk = game.get("gamePk")
                      teams = game.get("teams", {})

                      home_team = teams.get("home", {}).get("team", {}).get("name", "")
                      away_team = teams.get("away", {}).get("team", {}).get("name", "")

                      status = game.get("status", {})
                      abstract_state = status.get("abstractGameState", "")
                      detailed_state = status.get("detailedState", "")

                      if not game_pk:
                          continue

                      if abstract_state != "Final" and detailed_state not in ["Final", "Completed Early"]:
                          continue

                      box_url = f"https://statsapi.mlb.com/api/v1/game/{game_pk}/boxscore"

                      try:
                          box = get_json(box_url)
                      except Exception as e:
                          print(f"Skipped game {game_pk}: {e}")
                          continue

                      for side in ["home", "away"]:
                          team_data = box.get("teams", {}).get(side, {})
                          team_name = team_data.get("team", {}).get("name", "")
                          opponent = away_team if side == "home" else home_team

                          pitcher_ids = team_data.get("pitchers", [])

                          if not pitcher_ids:
                              continue

                          # First pitcher listed is the starter
                          starter_id = str(pitcher_ids[0])
                          players = team_data.get("players", {})
                          starter_data = players.get(f"ID{starter_id}")

                          if not starter_data:
                              continue

                          person = starter_data.get("person", {})
                          name = person.get("fullName", "")

                          if not name:
                              continue

                          pitchers.append({
                              "id": starter_id,
                              "player": name,
                              "team": team_name,
                              "opponent": opponent,
                              "gameDate": target_date
                          })

              print(f"Using actual starting pitchers from {target_date}")
              print(f"Found {len(pitchers)} starters")

              return pitchers

          def build_pitching_logs(through_date):
              start = through_date - timedelta(days=430)
              games = get_schedule_games(start.isoformat(), through_date.isoformat())

              logs = {}

              print(f"Building pitching logs from {len(games)} games")
              print(f"Pitching logs date range: {start.isoformat()} to {through_date.isoformat()}")

              for i, game in enumerate(games, start=1):
                  box_url = f"https://statsapi.mlb.com/api/v1/game/{game['gamePk']}/boxscore"

                  try:
                      box = get_json(box_url)
                  except Exception as e:
                      print(f"Skipped game {game['gamePk']}: {e}")
                      continue

                  for side in ["home", "away"]:
                      team_data = box.get("teams", {}).get(side, {})
                      team_name = team_data.get("team", {}).get("name", "")
                      opponent = game["away"] if side == "home" else game["home"]
                      players = team_data.get("players", {})

                      for player_key, pdata in players.items():
                          person = pdata.get("person", {})
                          player_id = str(person.get("id", player_key))
                          name = person.get("fullName", "")
                          pitching = pdata.get("stats", {}).get("pitching", {})

                          if not name or not pitching:
                              continue

                          batters_faced = int(pitching.get("battersFaced", 0) or 0)
                          outs = int(pitching.get("outs", 0) or 0)
                          strikeouts = int(pitching.get("strikeOuts", 0) or 0)

                          if batters_faced == 0 and outs == 0:
                              continue

                          if player_id not in logs:
                              logs[player_id] = {
                                  "player": name,
                                  "team": team_name,
                                  "games": []
                              }

                          logs[player_id]["player"] = name
                          logs[player_id]["team"] = team_name
                          logs[player_id]["games"].append({
                              "date": game["date"],
                              "team": team_name,
                              "opponent": opponent,
                              "k": strikeouts,
                              "outs": outs,
                              "battersFaced": batters_faced
                          })

                  if i % 50 == 0:
                      print(f"Processed {i}/{len(games)} games")
                      time.sleep(0.2)

              return logs

          def build_pitcher_k_props(through_date):
              props = load_props()
              lines = props.get("pitcherStrikeoutLines", {})

              slate_date = through_date.isoformat()
              starting_pitchers = get_starting_pitchers_for_date(slate_date)

              logs = build_pitching_logs(through_date)

              output = []

              for pitcher in starting_pitchers:
                  pid = pitcher["id"]
                  name = pitcher["player"]
                  opponent = pitcher["opponent"]

                  pdata = logs.get(pid)

                  if not pdata:
                      print(f"No logs found for {name}")
                      continue

                  games = sorted(pdata["games"], key=lambda x: x["date"], reverse=True)

                  starter_games = [g for g in games if g.get("outs", 0) >= 9]
                  if len(starter_games) >= 5:
                      games = starter_games

                  last10 = games[:10]
                  last5 = games[:5]
                  h2h = [g for g in games if g.get("opponent") == opponent][:5]

                  l10_values = [g["k"] for g in last10]
                  l5_values = [g["k"] for g in last5]
                  h2h_values = [g["k"] for g in h2h]

                  line = lines.get(name)

                  l10_avg = safe_avg(l10_values)
                  l5_avg = safe_avg(l5_values)
                  h2h_avg = safe_avg(h2h_values)

                  if h2h_values:
                      projection = round((l10_avg * 0.45) + (l5_avg * 0.35) + (h2h_avg * 0.20), 1)
                  else:
                      projection = round((l10_avg * 0.60) + (l5_avg * 0.40), 1)

                  edge = round(projection - line, 1) if line is not None else None

                  output.append({
                      "player": name,
                      "team": pitcher["team"],
                      "opponent": opponent,
                      "gameDate": pitcher.get("gameDate", slate_date),
                      "line": line,
                      "last10Avg": l10_avg,
                      "last5Avg": l5_avg,
                      "h2hAvg": h2h_avg,
                      "projection": projection,
                      "edge": edge,
                      "last10OverPct": over_pct(l10_values, line),
                      "last5OverPct": over_pct(l5_values, line),
                      "h2hOverPct": over_pct(h2h_values, line),
                      "last10": last10,
                      "last5": last5,
                      "h2h": h2h
                  })

              output.sort(key=lambda x: (x["edge"] if x["edge"] is not None else -999), reverse=True)

              return output

          def build_hr_streaks(through_date):
              start = through_date - timedelta(days=60)
              games = get_schedule_games(start.isoformat(), through_date.isoformat())

              player_logs = {}

              print(f"Building HR streaks from {len(games)} games")
              print(f"HR date range: {start.isoformat()} to {through_date.isoformat()}")

              for i, game in enumerate(games, start=1):
                  box_url = f"https://statsapi.mlb.com/api/v1/game/{game['gamePk']}/boxscore"

                  try:
                      box = get_json(box_url)
                  except:
                      continue

                  for side in ["home", "away"]:
                      team_data = box.get("teams", {}).get(side, {})
                      team_name = team_data.get("team", {}).get("name", "")
                      players = team_data.get("players", {})

                      for player_key, pdata in players.items():
                          person = pdata.get("person", {})
                          name = person.get("fullName", "")
                          player_id = str(person.get("id", player_key))
                          batting = pdata.get("stats", {}).get("batting", {})

                          if not name or not batting:
                              continue

                          at_bats = int(batting.get("atBats", 0) or 0)
                          plate_appearances = int(batting.get("plateAppearances", 0) or 0)
                          home_runs = int(batting.get("homeRuns", 0) or 0)

                          if at_bats == 0 and plate_appearances == 0:
                              continue

                          if player_id not in player_logs:
                              player_logs[player_id] = {
                                  "player": name,
                                  "team": team_name,
                                  "games": []
                              }

                          player_logs[player_id]["player"] = name
                          player_logs[player_id]["team"] = team_name
                          player_logs[player_id]["games"].append({
                              "date": game["date"],
                              "hr": home_runs
                          })

              hr_streaks = []

              for pdata in player_logs.values():
                  logs = sorted(pdata["games"], key=lambda x: x["date"], reverse=True)

                  if not logs or logs[0]["hr"] <= 0:
                      continue

                  streak_games = 0
                  total_hr = 0

                  for game in logs:
                      if game["hr"] > 0:
                          streak_games += 1
                          total_hr += game["hr"]
                      else:
                          break

                  hr_streaks.append({
                      "player": pdata["player"],
                      "team": pdata.get("team", ""),
                      "games": streak_games,
                      "hr": total_hr,
                      "lastGameDate": logs[0]["date"]
                  })

              hr_streaks.sort(key=lambda x: (x["games"], x["hr"]), reverse=True)
              return hr_streaks

          hits, hit_through_date = scrape_hit_streaks()

          # TEST DATE:
          # This forces pitcher K props to use actual starting pitchers from 2026-07-12.
          # Change this back to datetime.now(timezone.utc).date() when regular games are back.
          mlb_today = date(2026, 7, 12)

          hr = build_hr_streaks(mlb_today)
          pitcher_ks = build_pitcher_k_props(mlb_today)

          data = {
              "updated": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC"),
              "throughDate": mlb_today.isoformat(),
              "hitStreakThroughDate": hit_through_date.isoformat(),
              "hits": hits,
              "hr": hr,
              "pitcherKs": pitcher_ks
          }

          with open("data/streaks.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)

          print(f"Saved {len(hits)} hit streaks")
          print(f"Saved {len(hr)} HR streaks")
          print(f"Saved {len(pitcher_ks)} pitcher K props")
          print(f"Hit streak through date: {hit_through_date.isoformat()}")
          print(f"MLB data through date: {mlb_today.isoformat()}")

          if len(hits) == 0:
              raise Exception("No hit streak data found")
          EOF

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/streaks.json
          git commit -m "Update MLB data" || echo "No changes"
          git push
